[package]
name = "movie-monkey"
version = "2.0.0-alpha.1"
description = "A beautiful, local-first movie & TV library"
authors = ["Shrihari"]
license = "CC0-1.0"
edition = "2021"

[lib]
name = "movie_monkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.1", features = ["sync", "time", "fs", "macros", "rt-multi-thread"] }
futures = "0.3.34"
regex = "1.13.2"
walkdir = "2.5.1"
strsim = "0.11.1"
urlencoding = "2.1.3"
anyhow = "1.0.105"
log = "0.4.35"
notify = "9.0.0"
notify-debouncer-mini = "0.8.0"

[profile.dev.package."*"]
opt-level = 2
